# Nullmere Stillwater on the live web: the built extension in Chromium on
# real pages (news sites, two with no ads, and YouTube), each loaded with
# and without it, from a runner that can reach the web. A report, not a
# gate: the web changes under it. It fails only where the extension is at
# fault, and is run by hand.
name: Ad blocker, on the live web

on:
  workflow_dispatch:
    inputs:
      browser:
        description: "chromium (Playwright's) or chrome (Google Chrome as the runner has it, with the codecs people's Chrome has)"
        default: chromium
        type: choice
        options: [chromium, chrome]
      headed:
        description: "Show the browser's windows on a virtual display, not headless"
        default: false
        type: boolean
      only:
        description: "Visit only the pages whose names begin so, comma-separated (YouTube, BBC); every page if empty"
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: adblocker-live
  cancel-in-progress: false

jobs:
  live:
    name: Real pages, with and without the extension
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/chrome-adblocker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/chrome-adblocker/package-lock.json

      - name: Install Playwright, and its Chromium where that is the browser
        run: |
          npm ci
          if [ "${{ inputs.browser }}" = chrome ]; then google-chrome --version; else npx playwright install --with-deps chromium; fi

      - name: Build from the pinned lists
        run: npm run build

      - name: Visit the pages
        env:
          STILLWATER_CHROME: ${{ inputs.browser == 'chrome' && '1' || '' }}
          LIVE_HEADED: ${{ inputs.headed && '1' || '' }}
          LIVE_ONLY: ${{ inputs.only }}
        run: |
          if [ "$LIVE_HEADED" = 1 ]; then xvfb-run -a --server-args="-screen 0 1920x1080x24" node tools/live-check.js; else node tools/live-check.js; fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-report
          path: extensions/chrome-adblocker/live-report.json
          if-no-files-found: ignore
