name: Realm rules

# The realm (realm/): one persistent world whose rules run inside the
# SpacetimeDB module. Its rules' unit tests, its build to WebAssembly, and
# a play-through of the published module on a SpacetimeDB server started
# on the runner, through the HTTP API a client uses (realm/check.sh).
# Linux only, a few minutes: it runs apart from CI, which builds and tests
# the apps on Macs. Its client job also tests the pure Swift beneath the
# app here, the models, the world and the sound, sooner than the Mac can.
on:
  pull_request:
    paths:
      - realm/**
      - Sources/NullmereLive/**
      - Tests/NullmereLiveTests/**
      - Sources/NullmereLiveStage/**
      - Tests/NullmereLiveStageTests/**
      - Sources/NullmereRealm/**
      - Tests/NullmereRealmTests/**
      - Sources/NullmereLand/**
      - Sources/NullmereWorld/**
      - Sources/NullmereModels/**
      - Sources/NullmereSound/**
      - Tests/NullmereLandTests/**
      - Tests/NullmereModelsTests/**
      - Tests/NullmereWorldTests/**
      - Tests/NullmereSoundTests/**
      - Tests/NullmereTestSupport/**
      - Package.swift
      - .github/workflows/realm-check.yml
  push:
    branches: [main, "claude/**"]
    paths:
      - realm/**
      - Sources/NullmereLive/**
      - Tests/NullmereLiveTests/**
      - Sources/NullmereLiveStage/**
      - Tests/NullmereLiveStageTests/**
      - Sources/NullmereRealm/**
      - Tests/NullmereRealmTests/**
      - Sources/NullmereLand/**
      - Sources/NullmereWorld/**
      - Sources/NullmereModels/**
      - Sources/NullmereSound/**
      - Tests/NullmereLandTests/**
      - Tests/NullmereModelsTests/**
      - Tests/NullmereWorldTests/**
      - Tests/NullmereSoundTests/**
      - Tests/NullmereTestSupport/**
      - Package.swift
      - .github/workflows/realm-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realm-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  realm:
    name: Rules, module and play-through
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust's WebAssembly target and SpacetimeDB
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the realm
        run: realm/check.sh

      # The check a publish to maincloud ends with (plan 9.1), run as it is
      # there on the realm just published here: it passes where the realm
      # answers, and fails where none stands.
      - name: The realm answers, and one not published fails
        run: |
          REALM_ADDRESS=http://127.0.0.1:3000/nullmere-check scripts/go-live-status.sh --expect-realm
          if REALM_ADDRESS=http://127.0.0.1:3000/no-such-realm scripts/go-live-status.sh --expect-realm; then
            echo "::error::go-live-status.sh --expect-realm passed on a realm that was never published"
            exit 1
          fi

      # Then on the same server, the module published afresh: a hundred
      # players joining at once and asking, each three times a second for
      # half a minute, what players ask most; each ask's time from asking
      # to answer, printed as LOAD lines (plan 9.3). Server and players
      # share the runner: these are the realm's own times.
      - name: The realm under load
        timeout-minutes: 4
        run: realm/load.sh

      - name: The server's log, if it failed
        if: failure()
        run: |
          tail -n 60 build/realm-check-server.log 2>/dev/null || true
          # What failed, again, at the log's very foot, where its tail finds
          # it: the steps after a failing one bury its own account.
          echo "== What failed"
          grep -hE ": error: |' failed \(" realm-client.log realm-stage.log pure-swift.log build-client.log 2>/dev/null | head -n 40 || true

  # The realm's Swift client (Sources/NullmereLive) on the same server:
  # its lists of the realm's tables held to the module's source, then two
  # clients on a realm set to sixty times its written pace, who join,
  # build on the database's own timers, train troops and send an army to
  # gather and home again, every row pushed to them as it changes.
  client:
    name: Swift client on a live realm
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust and SpacetimeDB
        run: |
          # The Swift image has clang but no `cc`, which Rust links its
          # build scripts with.
          apt-get update -qq && apt-get install -y -qq curl python3 gcc libc6-dev > /dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A build that fails fails here, not as a play-through that finds
      # nothing built, and says its errors, not its last lines.
      - name: Build the client and its tests
        id: build
        shell: bash
        run: |
          swift build --build-tests -Xswiftc -warnings-as-errors > build-client.log 2>&1 || {
            grep -E "error:|warning:" build-client.log | sort -u | head -n 80
            exit 1
          }
          tail -n 5 build-client.log

      # The realm's own check starts the server and leaves it running.
      - name: Check the realm
        run: realm/check.sh

      - name: Play the realm through its Swift client
        run: |
          spacetime publish --server http://127.0.0.1:3000 --bin-path realm/target/wasm32-unknown-unknown/release/realm.wasm --yes --delete-data nullmere-client
          spacetime call --server http://127.0.0.1:3000 nullmere-client set_pace 60
          NULLMERE_REALM_CHECK=http://127.0.0.1:3000/nullmere-client stdbuf -oL -eL swift test --skip-build --filter NullmereLiveTests 2>&1 | tee realm-client.log || true
          total="$(grep "Executed .* tests" realm-client.log | tail -n 1)"
          echo "$total" | grep -Eq "Executed [1-9][0-9]* tests?, with 0 failures" && ! grep -q "skipped" realm-client.log || {
            echo "::error::The Swift client didn't play the realm through: $total"
            grep -E ": error: |' failed \(" realm-client.log | head -n 20
            exit 1
          }
          # And a window of that realm staged for the renderer: its land, its
          # cities and its armies, from the rows the server holds.
          NULLMERE_REALM_CHECK=http://127.0.0.1:3000/nullmere-client stdbuf -oL -eL swift test --skip-build --filter NullmereLiveStageTests 2>&1 | tee realm-stage.log || true
          grep -q "^LIVE a window" realm-stage.log && grep "Executed .* tests" realm-stage.log | tail -n 1 | grep -Eq "Executed [1-9][0-9]* tests?, with 0 failures" || {
            echo "::error::A window of the realm wasn't staged from its rows"
            grep -E ": error: |' failed \(" realm-stage.log | head -n 20
            exit 1
          }

      # The land, its models, the world as the GPU takes it and the sound,
      # all pure Swift, tested here as on the Mac and sooner: what they
      # draw and sound from a test world, not the realm's server.
      - name: The land, the models, the world and the sound, on Linux
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          stdbuf -oL -eL swift test --skip-build --filter "NullmereLandTests|NullmereModelsTests|NullmereWorldTests|NullmereSoundTests" 2>&1 | tee pure-swift.log || true
          total="$(grep "Executed .* tests" pure-swift.log | tail -n 1)"
          echo "$total" | grep -Eq "Executed [1-9][0-9]* tests?, with 0 failures" || {
            echo "::error::The models', the world's or the sound's tests failed on Linux: $total"
            grep -E ": error: |' failed \(" pure-swift.log | head -n 30
            exit 1
          }

      - name: The server's log, if it failed
        if: failure()
        run: |
          tail -n 60 build/realm-check-server.log 2>/dev/null || true
          # What failed, again, at the log's very foot, where its tail finds
          # it: the steps after a failing one bury its own account.
          echo "== What failed"
          grep -hE ": error: |' failed \(" realm-client.log realm-stage.log pure-swift.log build-client.log 2>/dev/null | head -n 40 || true
